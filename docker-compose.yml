services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus_university
      POSTGRES_USER: lucas
      POSTGRES_PASSWORD: Lh-19731973
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_university"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    depends_on:
      database:
        condition: service_healthy